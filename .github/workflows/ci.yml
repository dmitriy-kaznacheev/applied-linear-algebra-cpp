name: CI
run-name: "${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  formatting:
    name: Проверка форматирования (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Check formatting
        run: |
          FILES=$(find . \
            -path ./external -prune -o \
            -path ./build -prune -o \
            -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -print)

          if [[ -z "$FILES" ]]; then
            echo "Нет C++ файлов для проверки."
            exit 0
          fi

          echo "$FILES" | xargs clang-format-14 --dry-run --Werror

  build-and-test:
    name: ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    needs: formatting
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-16
            cxx: clang++-16
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            gcc-13 g++-13 clang-16 \
            libboost-iostreams-dev libboost-system-dev libboost-filesystem-dev \
            gnuplot-nox

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}